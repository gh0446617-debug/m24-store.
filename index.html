<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M24 STORE</title>
    <style>
        body { font-family: sans-serif; background-color: #0e1621; color: white; text-align: center; padding: 20px; }

        .btn { background: #242f3d; padding: 15px; border-radius: 10px; border: 1px solid #17212b; cursor: pointer; }
        .btn:hover { background: #2b5278; }
    </style>
</head>
<body>
    <h1>مرحباً بك في M24 STORE 🚀</h1>
    <p>أفضل الخدمات الرقمية</p>
    <div class="grid">
        <div class="btn">🎮 الألعاب</div>
        <div class="btn">✈️ تليجرام</div>
        <div class="btn">📞 رصيد</div>
        <div class="btn">💳 أكواد</div>
    </div>
</body>
</html>
